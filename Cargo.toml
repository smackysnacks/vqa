[package]
name = "vqa"
version = "0.7.0"
authors = ["Mack Stump <mack@mackstump.com>"]
edition = "2024"
rust-version = "1.89"
description = "Parser and decoder for Westwood Studios' VQA (Vector Quantized Animation) full-motion-video format"
homepage = "https://github.com/smackysnacks/vqa"
repository = "https://github.com/smackysnacks/vqa"
documentation = "https://docs.rs/vqa/"
license = "MIT"
readme = "README.md"
keywords = ["vqa", "westwood", "parser", "video", "adpcm"]
categories = [
  "parser-implementations",
  "multimedia::video",
  "multimedia::audio",
]
include = ["/src", "/examples/*.rs", "/CHANGELOG.md", "/LICENSE", "/README.md"]

[dependencies]
fearless_simd = "1.0"

# for the player example; left out on wasm so the tests run there (CI runs
# them on wasm32-wasip1 to cover a 32-bit target)
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
cpal = "0.18"
minifb = "0.28"
