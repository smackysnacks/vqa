name: Rust

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # ALSA headers for the cpal dev-dependency (examples build with --all-targets)
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Run tests
        run: cargo test --all-targets

      # --all-targets skips doctests, so run them separately
      - name: Run doctests
        run: cargo test --doc

      - name: Check docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The RGB conversion's NEON kernel only runs here
  test-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-targets

  # A 32-bit target, where usize overflows that 64-bit builds never hit
  # panic; wasm is also where browser players run
  test-wasm32:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install the wasm32-wasip1 target
        run: rustup target add wasm32-wasip1

      - name: Install wasmtime
        uses: taiki-e/install-action@v2
        with:
          tool: wasmtime

      - uses: Swatinem/rust-cache@v2

      # the golden tests read the sample movie by its absolute path; the
      # examples are built too, so one that doesn't build for wasm fails here
      - name: Run tests
        run: cargo test --target wasm32-wasip1
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir ${{ github.workspace }}

      # again with simd128, as the README says to build for wasm: the run
      # above covers the scalar fallback, this one the wasm SIMD kernels
      - name: Run tests with simd128
        run: cargo test --target wasm32-wasip1 --target-dir target/wasm-simd128
        env:
          RUSTFLAGS: -C target-feature=+simd128
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir ${{ github.workspace }}

  # Retail movies from FFmpeg's sample archive against pinned hashes (see
  # tests/samples.rs); the download is cached until tests/samples.txt changes
  samples:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Cache sample movies
        uses: actions/cache@v6
        with:
          path: samples
          key: samples-${{ hashFiles('tests/samples.txt') }}

      - name: Download sample movies
        run: just samples

      - uses: Swatinem/rust-cache@v2

      - name: Test against the sample movies
        run: just test-samples

  msrv:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.89
        run: rustup toolchain install 1.89 --profile minimal

      - uses: Swatinem/rust-cache@v2

      # the declared rust-version; dependencies resolve to versions that
      # support it
      - name: Check the library
        run: cargo +1.89 check --lib

  # Running the fuzz targets needs nightly (see fuzz.yml), but they build on
  # stable, which catches API changes that break them
  fuzz-targets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: Check the fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml

  semver:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # compares the public API against the latest release on crates.io
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit
